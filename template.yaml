AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Oficina Marimbondo - Lambda de autenticação por CPF

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Environment:
      Variables:
        APP_ENV: !Ref Environment
        OS_SERVICE_URL: !Ref OsServiceUrl
        INTERNAL_API_KEY: !Ref InternalApiKey
        JWT_SECRET: !Ref JwtSecret

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod, hml]
    Description: Ambiente do deploy (prod = branch main, hml = branch homolog)
  OsServiceUrl:
    Type: String
    Description: URL base do os-service (a Lambda consulta GET /internal/clients/by-cpf/{cpf}; não acessa banco)
  InternalApiKey:
    Type: String
    NoEcho: true
    Description: Chave enviada no header x-internal-api-key para o os-service
  JwtSecret:
    Type: String
    NoEcho: true

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, oficina-auth, !Sub "oficina-auth-${Environment}"]
      CodeUri: src/
      Handler: handler.handler
      Description: Valida CPF, consulta o cliente no os-service, nega inativos e devolve JWT
      Events:
        AuthApi:
          Type: Api
          Properties:
            Path: /auth
            Method: post
      Tags:
        Project: oficina-marimb0ndo
        Environment: !Ref Environment

Outputs:
  AuthApiUrl:
    Description: URL da API de autenticação
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/auth"
  AuthFunctionArn:
    Description: ARN da função Lambda
    Value: !GetAtt AuthFunction.Arn
