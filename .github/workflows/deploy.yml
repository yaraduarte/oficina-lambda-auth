name: Deploy Lambda Auth

# Fluxo de branches:
#   feature/*  --PR-->  homolog  (deploy do stack oficina-lambda-auth-hml / função oficina-auth-hml)
#   homolog    --PR-->  main     (deploy do stack oficina-lambda-auth / função oficina-auth)
# Em PR roda apenas validação e build (sem deploy).

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --prefix src
          npm ci

      - name: Testes unitários (cobertura mínima 80%)
        run: npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Validate
        run: sam validate --lint --region us-east-1

      - name: SAM Build
        run: sam build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}

    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'hml' }}
      STACK_NAME: ${{ github.ref_name == 'main' && 'oficina-lambda-auth' || 'oficina-lambda-auth-hml' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --prefix src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name "$STACK_NAME" \
            --s3-bucket oficina-marimb0ndo-tfstate-528568030535 \
            --s3-prefix "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=$APP_ENV \
              OsServiceUrl=${{ vars.OS_SERVICE_URL }} \
              InternalApiKey=${{ secrets.INTERNAL_API_KEY }} \
              JwtSecret=${{ secrets.JWT_SECRET }}
